name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev,orchestration]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest

      - name: Build DuckDB warehouse from fixtures
        run: python scripts/build_fixture_warehouse.py

      - name: dbt build
        working-directory: dbt
        run: dbt build --profiles-dir .

      - name: Validate Dagster definitions
        run: dagster definitions validate -f orchestration/definitions.py
